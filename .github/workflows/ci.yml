name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wheel-contract:
    name: Standalone Wheel Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.0
          python -m build --wheel
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl

      - name: Verify standalone initialization outside the checkout
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c 'from epacomp_tox.server import MCPServer; server = MCPServer(api_key="wheel-contract-test"); assert len(server.get_tools()) == 85'

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with black and isort
        run: |
          black --check src tests
          isort --check-only src tests

      - name: Run public-surface release gates
        run: |
          pytest \
            tests/test_release_metadata.py \
            tests/test_tool_catalog_snapshot.py \
            tests/test_tool_contracts.py \
            tests/test_portable_schemas.py \
            tests/test_domain_contracts.py \
            tests/test_cross_suite_handoffs.py \
            tests/test_mcp_conformance_suite.py \
            tests/test_live_transport_conformance.py \
            -q

      - name: Run tests
        run: pytest

  scientific-invariants:
    name: Track-B Scientific Invariants Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify vendored spine engine digests (tamper-evidence)
        run: python scripts/vendor_verify.py

      - name: Verify golden spine-projection + released corpus fixtures are byte-stable
        run: |
          python scripts/generate_spine_projection_golden.py
          python scripts/generate_aop_linkage_corpus.py
          git diff --exit-code tests/fixtures/governance/

      - name: Run scientific-invariants gate (pristine corpus must be GREEN)
        run: python scripts/run_scientific_invariants_gate.py

      - name: Run governance adversarial self-tests (per-code bite + guard + fail-closed)
        run: pytest tests/governance/ -q
