name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wheel-contract:
    name: Standalone Wheel Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.0
          python -m build --wheel
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl

      - name: Verify standalone initialization outside the checkout
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" - <<'PY'
          from epacomp_tox.contracts import SCHEMA_ROOT
          from epacomp_tox.server import MCPServer

          server = MCPServer(api_key="wheel-contract-test")
          assert len(server.get_tools()) == 85
          manifest = server.execute_tool("get_contract_manifest", {})
          assert len(manifest["responseSchemas"]) == len(list(SCHEMA_ROOT.glob("*/*.json"))) > 0
          assert len(manifest["portableObjectSchemas"]) == 8
          assert sum("exampleFile" in item for item in manifest["portableObjectSchemas"]) == 7
          PY

  installed-clients:
    name: Installed SDK1/SDK2 clients (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.12.21"
      - name: Build and install frozen runtime outside checkout
        run: |
          uv build
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/comptox-runtime.txt"
          uv venv "$RUNNER_TEMP/comptox-wheel"
          uv pip install --python "$RUNNER_TEMP/comptox-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/comptox-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/comptox-wheel/bin/python" --no-deps dist/*.whl
          uv sync --locked --project tests/compatibility/legacy-client
      - name: Verify all four installed real-client combinations
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/comptox-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_protocol_clients.py" \
            --server-python "$RUNNER_TEMP/comptox-wheel/bin/python" \
            --legacy-python "$GITHUB_WORKSPACE/tests/compatibility/legacy-client/.venv/bin/python" \
            --output-dir "$RUNNER_TEMP/comptox-client-results"

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with black and isort
        run: |
          black --check src tests
          isort --check-only src tests

      - name: Run public-surface release gates
        run: |
          pytest \
            tests/test_release_metadata.py \
            tests/test_tool_catalog_snapshot.py \
            tests/test_tool_contracts.py \
            tests/test_portable_schemas.py \
            tests/test_domain_contracts.py \
            tests/test_cross_suite_handoffs.py \
            tests/test_mcp_conformance_suite.py \
            tests/test_live_transport_conformance.py \
            -q

      - name: Run tests
        run: pytest

  scientific-invariants:
    name: Track-B Scientific Invariants Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify vendored spine engine digests (tamper-evidence)
        run: python scripts/vendor_verify.py

      - name: Verify golden spine-projection + released corpus fixtures are byte-stable
        run: |
          python scripts/generate_spine_projection_golden.py
          python scripts/generate_aop_linkage_corpus.py
          git diff --exit-code tests/fixtures/governance/

      - name: Run scientific-invariants gate (pristine corpus must be GREEN)
        run: python scripts/run_scientific_invariants_gate.py

      - name: Run governance adversarial self-tests (per-code bite + guard + fail-closed)
        run: pytest tests/governance/ -q
