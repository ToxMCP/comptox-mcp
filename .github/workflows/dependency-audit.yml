name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-dependencies:
    name: Locked dependency audit (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
      - name: Export all committed runtime and development dependencies
        run: uv export --locked --all-extras --all-groups --no-emit-project --no-hashes --output-file audit-requirements.txt
      - name: Audit exact locked versions against current advisories
        run: uvx --python "${{ matrix.python-version }}" pip-audit==2.10.1 --strict --desc --disable-pip --no-deps --requirement audit-requirements.txt --format json --output dependency-audit.json
      - name: Audit isolated legacy client lock
        run: |
          uv export --locked --project tests/compatibility/legacy-client --no-emit-project --no-hashes --output-file legacy-audit-requirements.txt
          uvx --python "${{ matrix.python-version }}" pip-audit==2.10.1 --strict --desc --disable-pip --no-deps --requirement legacy-audit-requirements.txt --format json --output legacy-dependency-audit.json
      - name: Retain audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-py${{ matrix.python-version }}
          path: |
            dependency-audit.json
            legacy-dependency-audit.json
          if-no-files-found: warn
