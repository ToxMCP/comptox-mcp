name: Semgrep SAST
on:
  pull_request:
  push:
    branches: [main, main, master]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep-sast
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.167.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan (free Community packs, gates on findings)
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off src
