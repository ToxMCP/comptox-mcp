name: Release SBOM

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-sbom:
    name: Build Dist And SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build and SBOM tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.0 cyclonedx-bom==7.2.2

      - name: Build package distributions
        run: python -m build --sdist --wheel

      - name: Create isolated environment for SBOM target
        run: |
          python -m venv .sbom-venv
          . .sbom-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify standalone wheel runtime
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.sbom-venv/bin/python" -c 'from epacomp_tox.server import MCPServer; server = MCPServer(api_key="wheel-contract-test"); assert len(server.get_tools()) == 85'

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment .sbom-venv \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file artifacts/epacomp-tox-mcp.sbom.cdx.json

      - name: Validate SBOM attestation metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sbom_path = Path("artifacts/epacomp-tox-mcp.sbom.cdx.json")
          sbom = json.loads(sbom_path.read_text(encoding="utf-8"))
          required = ("bomFormat", "serialNumber", "specVersion")
          missing = [key for key in required if not sbom.get(key)]

          if sbom.get("bomFormat") != "CycloneDX" or missing:
              raise SystemExit(
                  "SBOM is not compatible with actions/attest: "
                  f"bomFormat={sbom.get('bomFormat')!r}, missing={missing}"
              )
          PY

      - name: Attest release provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest release SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: artifacts/epacomp-tox-mcp.sbom.cdx.json

      - name: Normalize attestation bundles
        run: |
          mkdir -p artifacts/attestations
          cp "${{ steps.attest-provenance.outputs.bundle-path }}" artifacts/attestations/release-provenance.bundle.json
          cp "${{ steps.attest-sbom.outputs.bundle-path }}" artifacts/attestations/release-sbom-attestation.bundle.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-and-sbom
          path: |
            dist/*
            artifacts/epacomp-tox-mcp.sbom.cdx.json
            artifacts/attestations/*.json

      - name: Attach artifacts to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/* \
            artifacts/epacomp-tox-mcp.sbom.cdx.json \
            artifacts/attestations/*.json \
            --clobber
