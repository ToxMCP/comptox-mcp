name: Scientific Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 2"

permissions:
  contents: read

concurrency:
  group: scientific-validation
  cancel-in-progress: false

jobs:
  offline-scientific-validation:
    name: Offline Scientific Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate offline scientific validation reports
        run: |
          mkdir -p artifacts/scientific-validation/offline
          python scripts/scientific_validation_report.py \
            --json \
            --persistence-dir artifacts/scientific-validation/offline/bundles \
            --output-json artifacts/scientific-validation/offline/report.json \
            --output-markdown artifacts/scientific-validation/offline/report.md

      - name: Upload offline scientific validation artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scientific-validation-offline
          path: artifacts/scientific-validation/offline/**

  live-concordance-panel:
    name: Live Concordance Panel
    runs-on: ubuntu-latest
    env:
      CTX_API_KEY: ${{ secrets.CTX_API_KEY }}

    steps:
      - name: Check live credential availability
        id: live-credentials
        shell: bash
        run: |
          if [[ -n "${CTX_API_KEY:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CTX_API_KEY is not configured; skipping the live concordance steps."
          fi

      - name: Checkout
        if: ${{ steps.live-credentials.outputs.available == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        if: ${{ steps.live-credentials.outputs.available == 'true' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install project
        if: ${{ steps.live-credentials.outputs.available == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate live concordance panel reports
        if: ${{ steps.live-credentials.outputs.available == 'true' }}
        run: |
          mkdir -p artifacts/scientific-validation/live
          python scripts/live_concordance_panel.py \
            --json \
            --output-json artifacts/scientific-validation/live/report.json \
            --output-markdown artifacts/scientific-validation/live/report.md

      - name: Upload live concordance artifacts
        if: ${{ steps.live-credentials.outputs.available == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scientific-validation-live
          path: artifacts/scientific-validation/live/**
