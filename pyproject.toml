[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epacomp-tox-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the EPA CompTox API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "EPA CompTox MCP Maintainers" }
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "fastapi>=0.111,<0.113",
    "uvicorn[standard]>=0.29,<0.31",
    "websockets>=11,<13",
    "prometheus-client>=0.17,<0.21",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "httpx>=0.27,<0.28",
    "black>=24.4,<25.0",
    "isort>=5.13,<6.0",
    "coverage[toml]>=7.5,<8.0",
]

[project.urls]
Repository = "https://github.com/senseibelbi/CompTox_MCP"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated"
]
