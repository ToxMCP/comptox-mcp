[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epacomp-tox-mcp"
version = "0.2.3"
description = "Evidence federation MCP server for the EPA CompTox API"
readme = "README.md"
license = "Apache-2.0"
keywords = ["mcp", "model-context-protocol", "epa", "comptox", "toxicology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
authors = [
    { name = "EPA CompTox MCP Maintainers" }
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.137.2,<0.138",
    "uvicorn[standard]>=0.49,<0.50",
    "websockets>=14,<17",
    "prometheus-client>=0.21,<0.26",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "httpx>=0.27,<0.28",
    "black>=24.4,<25.0",
    "isort>=5.13,<6.0",
    "coverage[toml]>=7.5,<8.0",
]

[project.urls]
Homepage = "https://github.com/ToxMCP/comptox-mcp"
Repository = "https://github.com/ToxMCP/comptox-mcp"
Issues = "https://github.com/ToxMCP/comptox-mcp/issues"
Documentation = "https://github.com/ToxMCP/comptox-mcp/tree/main/docs"
Security = "https://github.com/ToxMCP/comptox-mcp/security/policy"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated"
]
